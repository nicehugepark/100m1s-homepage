name: 키움 500억+ 스크레이퍼 (10분)

on:
  # ──────────────────────────────────────────────────────────────────────
  # 🔴 비활성화 (2026-06-17, 대표 지시 "왜 클라우드냐, 로컬 있잖아"):
  #   키움 스냅샷 수집은 로컬 launchd cron (com.100m1s.kiwoom-scraper →
  #   scripts/kiwoom_cron.sh, 평일 08:00~22:00 매 10분 scrape) 이 단일 담당.
  #   본 GitHub Actions 스크레이퍼와 로컬 cron 이 같은 origin/main data/kiwoom/* 경로에
  #   동시 push → race + 데이터 출처 혼선 (실측: 6/16 하루 newzy-bot 3커밋 vs 로컬 34커밋).
  #   schedule 트리거 제거로 클라우드 자동 수집 중단 → 출처 단일화.
  #
  #   완전 삭제 대신 schedule 만 주석 처리 (백업/롤백 보존). 로컬 cron 장애 시
  #   아래 schedule 2줄 주석 해제 → 재활성화 (또는 Actions 탭에서 "Run workflow" 수동 실행).
  #   재활성화 시 로컬 cron 과 동시 가동 race 재발 주의 — 둘 중 하나만 켤 것.
  # ──────────────────────────────────────────────────────────────────────
  # schedule:
  #   # KST 08:00 ~ 22:00, 평일만, 매 10분. (UTC 변환: KST = UTC+9)
  #   # 두 줄로 분할 — KST 08:00 이 UTC 자정(00:00) 경계를 넘기 때문.
  #   #   KST 08:00~08:50  =  UTC 23:00~23:50 (전일)  → 요일도 한 칸 당겨 일~목(0-4)
  #   - cron: '*/10 23 * * 0-4'
  #   #   KST 09:00~22:50  =  UTC 00:00~13:50 (당일)  → 월~금(1-5)
  #   - cron: '*/10 0-13 * * 1-5'
  workflow_dispatch:  # 수동 실행만 유지 (백업 경로 — 로컬 cron 장애 시 임시 사용)

permissions:
  contents: write

concurrency:
  group: kiwoom-scrape
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: 체크아웃
        uses: actions/checkout@v4

      - name: Python 셋업
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 의존성 설치
        run: |
          python -m pip install --upgrade pip
          pip install -r scripts/kiwoom-scraper/requirements.txt

      - name: 스크레이퍼 실행
        env:
          KIWOOM_APPKEY: ${{ secrets.KIWOOM_APPKEY }}
          KIWOOM_SECRETKEY: ${{ secrets.KIWOOM_SECRETKEY }}
          KIWOOM_BASE_URL: ${{ secrets.KIWOOM_BASE_URL }}
        run: python scripts/kiwoom-scraper/main.py

      - name: 변경사항 커밋·푸시
        run: |
          git config user.name "newzy-bot"
          git config user.email "newzy-bot@100m1s.com"
          git add data/kiwoom/
          if git diff --cached --quiet; then
            echo "변경 없음 — 커밋 스킵"
          else
            git commit -m "chore(kiwoom): snapshot $(TZ=Asia/Seoul date '+%Y-%m-%d %H:%M KST')"
            git pull --rebase origin main || true
            git push
          fi
