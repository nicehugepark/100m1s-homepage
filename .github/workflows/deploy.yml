name: deploy (staging → main fast-forward)

# 목적: 에이전트(Claude Code)가 default 브랜치(main)를 직접 push 하지 않도록
#       비-default 브랜치(staging)에만 push → 본 워크플로가 main 으로 반영 → Pages 자동 배포.
# 근거: Claude Code auto-mode 분류기가 에이전트의 main 직접 push 를 비일관적으로 차단(harness 레벨).
#       staging 은 비-default 브랜치라 분류기가 허용 → 매번 대표 수동 push 마찰 제거.
# Pages source = legacy(main, /). main 갱신 시 implicit "pages build and deployment" 가 자동 트리거됨.

on:
  push:
    branches:
      - staging
  workflow_dispatch: {}

# GITHUB_TOKEN 에 main push 권한 부여 (repo Actions 기본 권한 = write, main 미보호 확인됨 2026-06-13)
permissions:
  contents: write

# 동시 배포 직렬화 (cron 의 main push 와 race 시 재시도로 흡수)
concurrency:
  group: deploy-staging-to-main
  cancel-in-progress: false

jobs:
  ff-to-main:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: 체크아웃 (전체 히스토리)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: staging
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: git 아이덴티티
        run: |
          git config user.name "deploy-bot"
          git config user.email "deploy-bot@100m1s.com"

      - name: staging → main 반영 (FF 우선, 실패 시 rebase 재시도)
        run: |
          set -euo pipefail
          git fetch origin main staging

          STAGING_SHA="$(git rev-parse origin/staging)"
          echo "staging  = ${STAGING_SHA}"
          echo "main     = $(git rev-parse origin/main)"

          # 최대 3회 시도 (cron 이 그 사이 main 을 밀어도 흡수)
          for attempt in 1 2 3; do
            echo "::group::시도 ${attempt}"
            git fetch origin main
            MAIN_SHA="$(git rev-parse origin/main)"

            if git merge-base --is-ancestor "${MAIN_SHA}" "${STAGING_SHA}"; then
              # main 이 staging 의 조상 → 순수 fast-forward 가능 (히스토리 선형 유지)
              echo "fast-forward 가능: main(${MAIN_SHA}) → staging(${STAGING_SHA})"
              if git push origin "${STAGING_SHA}:main"; then
                echo "::endgroup::"
                echo "DEPLOYED_SHA=${STAGING_SHA}" >> "$GITHUB_ENV"
                exit 0
              fi
            else
              # main 이 staging 보다 앞섬(cron 이 data/* 를 main 에 먼저 push 한 경우)
              # → staging 내용을 main 위로 rebase 후 push (배포 내용 보존, cron 산출물도 보존)
              echo "main 이 staging 보다 앞섬 → staging 을 main 위로 rebase"
              git checkout -B _deploy_tmp "${STAGING_SHA}"
              if git rebase "${MAIN_SHA}"; then
                NEW_SHA="$(git rev-parse HEAD)"
                if git push origin "HEAD:main"; then
                  echo "::endgroup::"
                  echo "DEPLOYED_SHA=${NEW_SHA}" >> "$GITHUB_ENV"
                  # staging 도 배포 결과로 동기화(다음 배포의 baseline)
                  git push origin "HEAD:staging" || true
                  exit 0
                fi
              else
                git rebase --abort || true
              fi
            fi
            echo "::endgroup::"
            echo "시도 ${attempt} 실패(경쟁 push 추정) — 재시도"
            sleep 5
          done

          echo "::error::3회 시도 모두 실패 — staging 이 main 과 충돌. 수동 확인 필요."
          exit 1

      - name: 배포 트리거 확인 로그
        if: success()
        run: |
          echo "main 갱신 완료: ${DEPLOYED_SHA:-unknown}"
          echo "GitHub Pages(legacy, main/) implicit 'pages build and deployment' 가 곧 자동 배포합니다."
          echo "라이브 확인: https://100m1s.com/ (1~2분 후)"
