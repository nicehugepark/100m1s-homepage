<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 600" width="1600" height="600" preserveAspectRatio="xMidYMid meet">
<rect x="0" y="0" width="1600" height="600" fill="#FFFFFF"/>
<text x="80" y="50" font-family="Pretendard, sans-serif" font-size="22" font-weight="600" fill="#0A2540">사례 11 회계 의견거절 — 4단계 + 거래정지 (가상 사례 mock)</text>

<!-- 1막 매출 위장 -->
<rect x="80" y="180" width="280" height="180" fill="#FFFFFF" stroke="#0A2540" stroke-width="1.5" rx="8"/>
<text x="100" y="216" font-family="Pretendard, sans-serif" font-size="22" font-weight="600" fill="#0A2540">1막 매출 위장</text>
<text x="100" y="252" font-family="Pretendard, sans-serif" font-size="14" fill="#4A5C75">관계사 순환거래</text>
<text x="100" y="276" font-family="Pretendard, sans-serif" font-size="14" fill="#4A5C75">D-180 ~ D-30 (150일)</text>
<text x="100" y="334" font-family="Pretendard, sans-serif" font-size="28" font-weight="700" fill="#C49930">매출 +800억</text>

<line x1="370" y1="270" x2="395" y2="270" stroke="#C49930" stroke-width="2"/>
<polygon points="395,264 410,270 395,276" fill="#C49930"/>
<text x="380" y="258" font-family="Pretendard, sans-serif" font-size="12" fill="#4A5C75" text-anchor="middle">150일</text>

<!-- 2막 사전 통보 -->
<rect x="420" y="180" width="280" height="180" fill="#FFFFFF" stroke="#A01528" stroke-width="1.5" rx="8"/>
<text x="440" y="216" font-family="Pretendard, sans-serif" font-size="22" font-weight="600" fill="#A01528">2막 사전 통보</text>
<text x="440" y="252" font-family="Pretendard, sans-serif" font-size="14" fill="#4A5C75">감사 의견거절 통보</text>
<text x="440" y="276" font-family="Pretendard, sans-serif" font-size="14" fill="#4A5C75">D-15 (15일 윈도우)</text>
<text x="440" y="334" font-family="Pretendard, sans-serif" font-size="28" font-weight="700" fill="#A01528">분배 가속</text>

<line x1="710" y1="270" x2="735" y2="270" stroke="#C49930" stroke-width="2"/>
<polygon points="735,264 750,270 735,276" fill="#C49930"/>
<text x="720" y="258" font-family="Pretendard, sans-serif" font-size="12" fill="#4A5C75" text-anchor="middle">15일</text>

<!-- 3막 의견거절 공시 -->
<rect x="760" y="180" width="280" height="180" fill="#FFFFFF" stroke="#A01528" stroke-width="1.5" rx="8"/>
<text x="780" y="216" font-family="Pretendard, sans-serif" font-size="22" font-weight="600" fill="#A01528">3막 의견거절</text>
<text x="780" y="252" font-family="Pretendard, sans-serif" font-size="14" fill="#4A5C75">감사보고서 공시</text>
<text x="780" y="276" font-family="Pretendard, sans-serif" font-size="14" fill="#4A5C75">D+0 16:30 (장 후)</text>
<text x="780" y="334" font-family="Pretendard, sans-serif" font-size="28" font-weight="700" fill="#A01528">신뢰 붕괴</text>

<line x1="1050" y1="270" x2="1075" y2="270" stroke="#C49930" stroke-width="2"/>
<polygon points="1075,264 1090,270 1075,276" fill="#C49930"/>
<text x="1060" y="258" font-family="Pretendard, sans-serif" font-size="12" fill="#4A5C75" text-anchor="middle">1일</text>

<!-- 4막 거래정지 (gate, dashed gold) -->
<rect x="1100" y="180" width="280" height="180" fill="#FFF5E5" stroke="#C49930" stroke-width="2" stroke-dasharray="6 3" rx="8"/>
<text x="1120" y="216" font-family="Pretendard, sans-serif" font-size="22" font-weight="600" fill="#0A2540">4막 거래정지</text>
<text x="1120" y="252" font-family="Pretendard, sans-serif" font-size="14" fill="#4A5C75">D+1 거래소 정지</text>
<text x="1120" y="276" font-family="Pretendard, sans-serif" font-size="14" fill="#4A5C75">시간외 호가만</text>
<text x="1120" y="334" font-family="Pretendard, sans-serif" font-size="26" font-weight="700" fill="#A01528">0원 손실</text>

<text x="80" y="560" font-family="Pretendard, sans-serif" font-size="14" fill="#6C757D" font-style="italic">출처 · DART 감사보고서 의견거절 + 거래정지 결합 · 가상 사례 mock · 학습 시뮬레이션</text>
</svg>
