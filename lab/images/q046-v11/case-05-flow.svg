<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 600" width="1600" height="600" preserveAspectRatio="xMidYMid meet">
<rect x="0" y="0" width="1600" height="600" fill="#FFFFFF"/>
<text x="80" y="50" font-family="Pretendard, sans-serif" font-size="22" font-weight="600" fill="#0A2540">사례 5 CB 헐값 발행 — 4단계 사이클 (가상 사례 mock)</text>

<!-- 1막 발행 -->
<rect x="80" y="180" width="280" height="180" fill="#FFFFFF" stroke="#0A2540" stroke-width="1.5" rx="8"/>
<text x="100" y="216" font-family="Pretendard, sans-serif" font-size="22" font-weight="600" fill="#0A2540">1막 CB 발행</text>
<text x="100" y="252" font-family="Pretendard, sans-serif" font-size="14" fill="#4A5C75">전환가 시가 -19%</text>
<text x="100" y="276" font-family="Pretendard, sans-serif" font-size="14" fill="#4A5C75">D-180 사모 발행</text>
<text x="100" y="334" font-family="Pretendard, sans-serif" font-size="28" font-weight="700" fill="#C49930">200억 / ₩7,000</text>

<line x1="370" y1="270" x2="395" y2="270" stroke="#C49930" stroke-width="2"/>
<polygon points="395,264 410,270 395,276" fill="#C49930"/>
<text x="380" y="258" font-family="Pretendard, sans-serif" font-size="12" fill="#4A5C75" text-anchor="middle">90일</text>

<!-- 2막 매집 -->
<rect x="420" y="180" width="280" height="180" fill="#FFFFFF" stroke="#0A2540" stroke-width="1.5" rx="8"/>
<text x="440" y="216" font-family="Pretendard, sans-serif" font-size="22" font-weight="600" fill="#0A2540">2막 매집</text>
<text x="440" y="252" font-family="Pretendard, sans-serif" font-size="14" fill="#4A5C75">본주식 매집 + 리픽싱</text>
<text x="440" y="276" font-family="Pretendard, sans-serif" font-size="14" fill="#4A5C75">D-90 ~ D-7 (83일)</text>
<text x="440" y="334" font-family="Pretendard, sans-serif" font-size="28" font-weight="700" fill="#C49930">평단 ₩7,200</text>

<line x1="710" y1="270" x2="735" y2="270" stroke="#C49930" stroke-width="2"/>
<polygon points="735,264 750,270 735,276" fill="#C49930"/>
<text x="720" y="258" font-family="Pretendard, sans-serif" font-size="12" fill="#4A5C75" text-anchor="middle">7일</text>

<!-- 3막 전환청구 -->
<rect x="760" y="180" width="280" height="180" fill="#FFFFFF" stroke="#A01528" stroke-width="1.5" rx="8"/>
<text x="780" y="216" font-family="Pretendard, sans-serif" font-size="22" font-weight="600" fill="#A01528">3막 전환청구</text>
<text x="780" y="252" font-family="Pretendard, sans-serif" font-size="14" fill="#4A5C75">전환청구 공시 + 분배</text>
<text x="780" y="276" font-family="Pretendard, sans-serif" font-size="14" fill="#4A5C75">D-7 ~ D+0 (7일)</text>
<text x="780" y="334" font-family="Pretendard, sans-serif" font-size="28" font-weight="700" fill="#A01528">물량 +200억주</text>

<line x1="1050" y1="270" x2="1075" y2="270" stroke="#C49930" stroke-width="2"/>
<polygon points="1075,264 1090,270 1075,276" fill="#C49930"/>
<text x="1060" y="258" font-family="Pretendard, sans-serif" font-size="12" fill="#4A5C75" text-anchor="middle">30일</text>

<!-- 4막 신규 사이클 -->
<rect x="1100" y="180" width="280" height="180" fill="#FFFFFF" stroke="#C49930" stroke-width="1.5" stroke-dasharray="4 2" rx="8"/>
<text x="1120" y="216" font-family="Pretendard, sans-serif" font-size="22" font-weight="600" fill="#0A2540">4막 무한 반복</text>
<text x="1120" y="252" font-family="Pretendard, sans-serif" font-size="14" fill="#4A5C75">풋옵션 차익 + 신규 CB</text>
<text x="1120" y="276" font-family="Pretendard, sans-serif" font-size="14" fill="#4A5C75">D+30 ~ 영구 사이클</text>
<text x="1120" y="334" font-family="Pretendard, sans-serif" font-size="28" font-weight="700" fill="#C49930">차익 +35%</text>

<text x="80" y="560" font-family="Pretendard, sans-serif" font-size="14" fill="#6C757D" font-style="italic">출처 · DART CB 발행·전환청구 공시 + §178 부정거래 · 가상 사례 mock · 학습 시뮬레이션</text>
</svg>
