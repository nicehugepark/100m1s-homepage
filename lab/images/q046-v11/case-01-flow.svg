<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 600" width="1600" height="600" preserveAspectRatio="xMidYMid meet">
<rect x="0" y="0" width="1600" height="600" fill="#FFFFFF"/>
<text x="80" y="50" font-family="Pretendard, sans-serif" font-size="22" font-weight="600" fill="#0A2540">사례 1 통정매매 — 4단계 시퀀스 (가상 사례 mock)</text>

<!-- 1막 매집 -->
<rect x="80" y="180" width="280" height="180" fill="#FFFFFF" stroke="#0A2540" stroke-width="1.5" rx="8"/>
<text x="100" y="216" font-family="Pretendard, sans-serif" font-size="22" font-weight="600" fill="#0A2540">1막 매집</text>
<text x="100" y="252" font-family="Pretendard, sans-serif" font-size="14" fill="#4A5C75">12 차명 분산 매집</text>
<text x="100" y="276" font-family="Pretendard, sans-serif" font-size="14" fill="#4A5C75">D-90 ~ D-30 (60일)</text>
<text x="100" y="334" font-family="Pretendard, sans-serif" font-size="28" font-weight="700" fill="#C49930">시드 360억</text>

<!-- 화살표 1 -->
<line x1="370" y1="270" x2="395" y2="270" stroke="#C49930" stroke-width="2"/>
<polygon points="395,264 410,270 395,276" fill="#C49930"/>
<text x="380" y="258" font-family="Pretendard, sans-serif" font-size="12" fill="#4A5C75" text-anchor="middle">60일</text>

<!-- 2막 띄움 -->
<rect x="420" y="180" width="280" height="180" fill="#FFFFFF" stroke="#0A2540" stroke-width="1.5" rx="8"/>
<text x="440" y="216" font-family="Pretendard, sans-serif" font-size="22" font-weight="600" fill="#0A2540">2막 띄움</text>
<text x="440" y="252" font-family="Pretendard, sans-serif" font-size="14" fill="#4A5C75">통정매매 ×3/일</text>
<text x="440" y="276" font-family="Pretendard, sans-serif" font-size="14" fill="#4A5C75">D-30 ~ D-7 (23일)</text>
<text x="440" y="334" font-family="Pretendard, sans-serif" font-size="28" font-weight="700" fill="#C49930">거래대금 ×5</text>

<!-- 화살표 2 -->
<line x1="710" y1="270" x2="735" y2="270" stroke="#C49930" stroke-width="2"/>
<polygon points="735,264 750,270 735,276" fill="#C49930"/>
<text x="720" y="258" font-family="Pretendard, sans-serif" font-size="12" fill="#4A5C75" text-anchor="middle">23일</text>

<!-- 3막 분배 -->
<rect x="760" y="180" width="280" height="180" fill="#FFFFFF" stroke="#A01528" stroke-width="1.5" rx="8"/>
<text x="780" y="216" font-family="Pretendard, sans-serif" font-size="22" font-weight="600" fill="#A01528">3막 분배</text>
<text x="780" y="252" font-family="Pretendard, sans-serif" font-size="14" fill="#4A5C75">호재 갭상승 분할매도</text>
<text x="780" y="276" font-family="Pretendard, sans-serif" font-size="14" fill="#4A5C75">D-7 ~ D+0 (7일)</text>
<text x="780" y="334" font-family="Pretendard, sans-serif" font-size="28" font-weight="700" fill="#C49930">+1,180억 차익</text>

<!-- 화살표 3 -->
<line x1="1050" y1="270" x2="1075" y2="270" stroke="#C49930" stroke-width="2"/>
<polygon points="1075,264 1090,270 1075,276" fill="#C49930"/>
<text x="1060" y="258" font-family="Pretendard, sans-serif" font-size="12" fill="#4A5C75" text-anchor="middle">7일</text>

<!-- 4막 이탈 -->
<rect x="1100" y="180" width="280" height="180" fill="#FFFFFF" stroke="#A01528" stroke-width="1.5" rx="8"/>
<text x="1120" y="216" font-family="Pretendard, sans-serif" font-size="22" font-weight="600" fill="#A01528">4막 이탈</text>
<text x="1120" y="252" font-family="Pretendard, sans-serif" font-size="14" fill="#4A5C75">신용 반대매매 연쇄</text>
<text x="1120" y="276" font-family="Pretendard, sans-serif" font-size="14" fill="#4A5C75">D+1 ~ D+30 (30일)</text>
<text x="1120" y="334" font-family="Pretendard, sans-serif" font-size="28" font-weight="700" fill="#A01528">-19% 폭락</text>

<text x="80" y="560" font-family="Pretendard, sans-serif" font-size="14" fill="#6C757D" font-style="italic">출처 · 자본시장법 §176-1 시세조종 + §443 가중처벌 · 가상 사례 mock · 학습 시뮬레이션</text>
</svg>
