<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="dark light">
<!-- 미게재 자산 — 검색 노출 차단 + nav 미링크 (브랜드 로고 인트로 영상 프리뷰) -->
<meta name="robots" content="noindex, nofollow">
<title>華麗 로고 인트로 — Sora v4 | 100M1S</title>
<!-- 빈 파비콘 인라인 — 브라우저 기본 /favicon.ico 요청(404) 억제, 추가 네트워크 0 -->
<link rel="icon" href="data:,">

<style>
  :root {
    --bg: #06080d;        /* 영상이 주인공 — 깊은 다크 배경 (라이트/다크 공통, 영상 대비 최대) */
    --fg: #e8ecf4;
    --muted: rgba(232,236,244,.62);
    --accent: #d9be7e;    /* PM320 골드 토큰과 동일 계열 */
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    height: 100%;
    background: var(--bg);
    color: var(--fg);
    font-family: -apple-system, BlinkMacSystemFont, "Pretendard", "Apple SD Gothic Neo", "Segoe UI", Roboto, sans-serif;
    -webkit-font-smoothing: antialiased;
    overscroll-behavior: none;
  }
  /* 화면 꽉 참 — 모바일 주소창 변동 대응(100dvh), 노치 안전영역 패딩 */
  .stage {
    position: fixed;
    inset: 0;
    height: 100dvh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: max(env(safe-area-inset-top), 12px) 12px max(env(safe-area-inset-bottom), 12px);
    gap: 14px;
  }
  .player {
    position: relative;
    width: 100%;
    max-width: 720px;          /* 데스크탑에서 과대 확대 방지 */
    aspect-ratio: 16 / 9;
    border-radius: 14px;
    overflow: hidden;
    background: #000;
    box-shadow: 0 18px 60px rgba(0,0,0,.55), 0 0 0 1px rgba(217,190,126,.14);
    cursor: pointer;
  }
  video {
    display: block;
    width: 100%;
    height: 100%;
    object-fit: contain;       /* 16:9 영상 — 잘림 없이 꽉 차게(contain), 배경 검정과 융합 */
    background: #000;
  }
  /* 일시정지 오버레이 — 탭하면 등장, 다시 탭하면 재생 */
  .play-overlay {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    background: rgba(0,0,0,.34);
    opacity: 0;
    transition: opacity .18s ease;
    pointer-events: none;
  }
  .player.paused .play-overlay { opacity: 1; }
  .play-overlay svg { width: 64px; height: 64px; filter: drop-shadow(0 2px 10px rgba(0,0,0,.6)); }

  .caption {
    text-align: center;
    line-height: 1.5;
  }
  .caption .t {
    font-size: 15px;
    font-weight: 600;
    letter-spacing: .01em;
  }
  .caption .s {
    margin-top: 3px;
    font-size: 12px;
    color: var(--muted);
  }
  .caption .accent { color: var(--accent); }

  /* v1 / v2 비교 토글 — 탭하기 큰 세그먼트(모바일 터치 타깃 ≥44px) */
  .toggle {
    display: inline-flex;
    padding: 4px;
    gap: 4px;
    border-radius: 999px;
    background: rgba(232,236,244,.07);
    box-shadow: inset 0 0 0 1px rgba(232,236,244,.10);
  }
  .toggle button {
    -webkit-appearance: none;
    appearance: none;
    border: 0;
    cursor: pointer;
    min-height: 44px;
    padding: 0 20px;
    border-radius: 999px;
    font: inherit;
    font-size: 14px;
    font-weight: 600;
    letter-spacing: .01em;
    color: var(--muted);
    background: transparent;
    transition: color .15s ease, background .15s ease;
  }
  .toggle button[aria-pressed="true"] {
    color: #1a1408;
    background: var(--accent);
    box-shadow: 0 2px 10px rgba(217,190,126,.32);
  }
  .toggle button:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }
  @media (min-width: 768px) {
    .caption .t { font-size: 17px; }
    .caption .s { font-size: 13px; }
  }
</style>
</head>
<body>
  <main class="stage">
    <div class="player" id="player" role="button" tabindex="0" aria-label="영상 재생/일시정지 토글">
      <!--
        v4 기본 노출. WebM/VP9을 먼저 두어 모바일·모던 브라우저가 우선 선택(용량/LCP 완화),
        H.264 MP4는 Safari 등 폴백. poster + preload="metadata"로 첫 페인트 경량화.
        faststart(moov 선두) — MP4 폴백 시에도 전량 다운로드 전 재생 시작.
      -->
      <video
        id="v"
        poster="poster-v4.jpg"
        preload="metadata"
        autoplay
        loop
        muted
        playsinline
        webkit-playsinline
        disablepictureinpicture
        x5-playsinline>
        <source id="src-webm" src="hwaryeo-intro-sora-v4.webm" type="video/webm">
        <source id="src-mp4" src="hwaryeo-intro-sora-v4.mp4" type="video/mp4">
      </video>
      <div class="play-overlay" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none">
          <circle cx="12" cy="12" r="11" fill="rgba(0,0,0,.45)" stroke="rgba(255,255,255,.85)" stroke-width="1.2"/>
          <path d="M9.5 8.2v7.6l6-3.8-6-3.8z" fill="#fff"/>
        </svg>
      </div>
    </div>

    <div class="toggle" role="group" aria-label="버전 선택">
      <button type="button" data-v="v4" aria-pressed="true">v4</button>
      <button type="button" data-v="v3" aria-pressed="false">v3</button>
      <button type="button" data-v="v2" aria-pressed="false">v2</button>
      <button type="button" data-v="v1" aria-pressed="false">v1</button>
    </div>

    <div class="caption">
      <div class="t">華麗 <span class="accent">로고 인트로</span> · <span id="ver-label">Sora v4</span></div>
      <div class="s">16초 · 화면을 탭하면 일시정지/재생 · v1/v2/v3/v4 비교 가능</div>
    </div>
  </main>

  <script>
    (function () {
      var v = document.getElementById('v');
      var player = document.getElementById('player');
      var verLabel = document.getElementById('ver-label');
      var toggleBtns = document.querySelectorAll('.toggle button');

      // 버전별 소스 정의 — v4/v3/v2는 WebM 우선+MP4 폴백, v1은 MP4 단일(원본 보존, 비교용)
      var SOURCES = {
        v4: { poster: 'poster-v4.jpg', label: 'Sora v4',
              sources: [
                { src: 'hwaryeo-intro-sora-v4.webm', type: 'video/webm' },
                { src: 'hwaryeo-intro-sora-v4.mp4',  type: 'video/mp4'  }
              ] },
        v3: { poster: 'poster-v3.jpg', label: 'Sora v3',
              sources: [
                { src: 'hwaryeo-intro-sora-v3.webm', type: 'video/webm' },
                { src: 'hwaryeo-intro-sora-v3.mp4',  type: 'video/mp4'  }
              ] },
        v2: { poster: 'poster-v2.jpg', label: 'Sora v2',
              sources: [
                { src: 'hwaryeo-intro-sora-v2.webm', type: 'video/webm' },
                { src: 'hwaryeo-intro-sora-v2.mp4',  type: 'video/mp4'  }
              ] },
        v1: { poster: 'poster.jpg', label: 'Sora v1',
              sources: [
                { src: 'hwaryeo-intro-sora-v1.mp4',  type: 'video/mp4'  }
              ] }
      };

      function syncPausedClass() {
        player.classList.toggle('paused', v.paused);
      }

      function toggle() {
        if (v.paused) {
          v.play().catch(function () {});
        } else {
          v.pause();
        }
      }

      function loadVersion(key) {
        var conf = SOURCES[key];
        if (!conf) return;
        // <source> 교체 후 load() 호출 — 브라우저가 type 적합 소스를 다시 선택
        v.innerHTML = '';
        conf.sources.forEach(function (s) {
          var el = document.createElement('source');
          el.src = s.src;
          el.type = s.type;
          v.appendChild(el);
        });
        v.poster = conf.poster;
        verLabel.textContent = conf.label;
        v.load();
        v.play().catch(function () { player.classList.add('paused'); });

        toggleBtns.forEach(function (b) {
          b.setAttribute('aria-pressed', String(b.dataset.v === key));
        });
        document.title = '華麗 로고 인트로 — ' + conf.label + ' | 100M1S';
      }

      // 재생/일시정지 토글 (영상 탭)
      player.addEventListener('click', toggle);
      player.addEventListener('keydown', function (e) {
        if (e.key === ' ' || e.key === 'Enter') { e.preventDefault(); toggle(); }
      });
      v.addEventListener('play', syncPausedClass);
      v.addEventListener('pause', syncPausedClass);

      // 버전 토글 (세그먼트 버튼) — 영상 클릭 토글로 버블링되지 않게 중단
      toggleBtns.forEach(function (b) {
        b.addEventListener('click', function (e) {
          e.stopPropagation();
          if (b.getAttribute('aria-pressed') === 'true') return;
          loadVersion(b.dataset.v);
        });
      });

      // iOS 저전력 모드 등으로 autoplay가 막히면 poster 위 재생 버튼 노출(탭 유도)
      v.play().catch(function () { player.classList.add('paused'); });
    })();
  </script>
</body>
</html>
