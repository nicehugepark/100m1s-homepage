<!DOCTYPE html>
<html lang="ko" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0a1020" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#f3f1ea" media="(prefers-color-scheme: light)">
<meta name="robots" content="noindex, nofollow">
<title>100M1S 로고 — 리퀴드 메탈 光彩 (v6)</title>

<!-- 미리 로딩: LCP 핵심 자산 (모바일 우선). WebGL 텍스처 마스크로도 동일 자산 재사용. -->
<link rel="preload" as="image" href="assets/logo-v5b.webp" type="image/webp">

<style>
/* ====================================================================
   100M1S "리퀴드 메탈 光彩" 라이브 프리뷰 — v6 (WWDC 2026 리퀴드 글래스 강도).
   주 기법: WebGL fragment shader — 흐르는 FBM 노이즈가 절차적 노멀을 만들고
            그 위에 강한 specular flow + 이리데센트 thin-film + bloom 하이라이트를
            실시간 합성. 로고 알파(webp)를 텍스처 마스크로 곱해 '금속 표면 위'에서만
            크롬 광채가 *살아 흐른다*. 강렬하되 애플급 절제(specular는 좁고 밝게).
   폴백: WebGL 미지원/실패 시 canvas 숨김 → 기존 다층 CSS 光彩(sweep+prism+glint+
         bloom)가 그대로 로고를 채움 (백지 로고 금지, 거짓 충실성 가드).
   성능(모바일 390px): DPR ≤ 2 캡, 캔버스는 로고 stage 영역만, rAF 단일 루프.
   접근성: prefers-reduced-motion → 정지(정적 프레임 1장). 수동 토글 동일.
   📱 모바일 우선: 로고가 폰 폭을 꽉 채움. 다크 = 기본.
   ⚠ nav 미링크 내부 프리뷰. brand 자산만 (내부 데이터 0).
   ==================================================================== */

:root{
  /* 다크 = 기본 (프리미엄 딥 네이비→블랙, 크롬 광채가 가장 산다) */
  --bg-0:#05080f;
  --bg-1:#0a1120;
  --bg-2:#0f1c38;
  --ink:#eef1f8;
  --ink-dim:#8d98b4;
  --ink-faint:#56607c;
  --accent:#e6c168;               /* 골드 */
  --accent-soft:#d9b25a;
  --hairline:rgba(255,255,255,.10);
  --panel:rgba(255,255,255,.045);
  --panel-bd:rgba(255,255,255,.09);
  /* 로고 발광 강도 (다크에서 강하게) */
  --glow:0 0 46px rgba(230,193,104,.40), 0 0 110px rgba(230,193,104,.18);
  /* CSS 폴백 sweep / iridescence 불투명도 */
  --sweep-op:.95;
  --prism-op:.42;
  --bloom-op:.6;
  /* shader 강도 (다크) — JS가 읽어 uniform 전달 */
  --shine-intensity:1;
}

:root[data-theme="light"]{
  /* 라이트 = 따뜻한 샴페인 페이퍼. 알파 컷아웃이라 '스티커' 없음.
     광채는 절제 (밝은 배경에선 과하면 위화감) — 가독·우아 우선. */
  --bg-0:#efece2;
  --bg-1:#f4f1e8;
  --bg-2:#e7e2d4;
  --ink:#222838;
  --ink-dim:#5f6883;
  --ink-faint:#8a92a6;
  --accent:#9a7a2e;
  --accent-soft:#a8842f;
  --hairline:rgba(20,24,40,.10);
  --panel:rgba(20,24,40,.035);
  --panel-bd:rgba(20,24,40,.12);
  --glow:0 0 30px rgba(154,122,46,.22), 0 0 66px rgba(154,122,46,.10);
  --sweep-op:.72;
  --prism-op:.22;     /* 라이트에선 무지개 절제 */
  --bloom-op:.32;
  --shine-intensity:.68;   /* 라이트 모드에선 광채 강도 down → 위화감 가드 */
}

*{box-sizing:border-box;}
html,body{height:100%;margin:0;}
body{
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Apple SD Gothic Neo",
              "Pretendard","Segoe UI","Helvetica Neue",sans-serif;
  color:var(--ink);
  background:
    radial-gradient(130% 100% at 50% -8%, var(--bg-2), var(--bg-1) 46%, var(--bg-0) 100%);
  min-height:100svh;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:clamp(26px,7vw,40px);
  padding:max(28px,env(safe-area-inset-top)) 18px max(36px,env(safe-area-inset-bottom));
  -webkit-font-smoothing:antialiased;
  text-rendering:optimizeLegibility;
  transition:background .55s ease, color .35s ease;
  overflow-x:hidden;
}

/* ── hero 스테이지 — 모바일에서 폭을 꽉 채움 ───────────────────── */
.stage{
  position:relative;
  width:min(86vw,420px);
  aspect-ratio:1/1;
  display:grid;
  place-items:center;
  isolation:isolate;            /* blend 격리 → 배경으로 새지 않음 */
}

/* 0) 뒤 bloom — 로고 뒤에서 번지는 골드 후광 (느린 호흡). 크롬을 받쳐 깊이감. */
.stage::before{
  content:"";
  position:absolute; inset:2%;
  border-radius:50%;
  background:radial-gradient(circle at 50% 46%,
              rgba(230,193,104,.40), rgba(230,193,104,.08) 52%, transparent 72%);
  filter:blur(16px);
  opacity:var(--bloom-op);
  z-index:0;
  animation:bloom 7.5s ease-in-out infinite;
}

/* 공통 CSS 레이어 베이스 (폴백 경로).
   ⚠ 마스크는 알파 컷아웃(logo-v5b.webp)을 그대로 사용 — 마스크는 소스의
   '알파 채널'을 읽으므로(mask-mode:match-source 기본) 실루엣이 정확히 클리핑된다. */
.layer{
  position:absolute; inset:0;
  background-repeat:no-repeat;
  background-position:center;
  background-size:contain;
  -webkit-mask-image:url('assets/logo-v5b.webp');
          mask-image:url('assets/logo-v5b.webp');
  -webkit-mask-size:contain;     mask-size:contain;
  -webkit-mask-repeat:no-repeat; mask-repeat:no-repeat;
  -webkit-mask-position:center;  mask-position:center;
  pointer-events:none;
}

/* 1) base 로고 (알파 컷아웃, 골드 발광) — 항상 존재 (WebGL/CSS 공통 바닥) */
.logo{
  position:absolute; inset:0;
  background-image:url('assets/logo-v5b.webp');
  background-size:contain; background-repeat:no-repeat; background-position:center;
  z-index:1;
  filter:drop-shadow(var(--glow));
  animation:breathe 6.5s ease-in-out infinite;
}

/* 2) WebGL 리퀴드 메탈 캔버스 — 로고 알파로 마스크된 흐르는 크롬 광채.
   주 경로. screen 블렌드로 base 골드 위에 빛을 더함. */
.metal-canvas{
  position:absolute; inset:0;
  width:100%; height:100%;
  z-index:2;
  mix-blend-mode:screen;
  pointer-events:none;
  opacity:0;                       /* JS가 WebGL init 성공 시 1로 (폴백 시 0 유지) */
  transition:opacity .6s ease;
}

/* ── CSS 폴백 광채 레이어 (WebGL 실패 시에만 표시) ────────────────
   기본은 숨김(.shine 비활성). body.gl-failed 시 활성 → 백지 로고 0. */
.shine{display:none;}
body.gl-failed .shine{display:block;}

/* 골드 specular sweep */
.shine-gold{
  z-index:3;
  background:linear-gradient(112deg,
      transparent 40%, rgba(255,247,224,0) 45%,
      rgba(255,250,236,.9) 50%, rgba(255,247,224,0) 55%, transparent 60%);
  background-size:240% 240%;
  mix-blend-mode:screen;
  opacity:var(--sweep-op);
  animation:sweep 6.2s linear infinite;
}
/* 프리즘 / 이리데센트 크롬 (오일슬릭) */
.shine-prism{
  z-index:4;
  background:linear-gradient(128deg,
      transparent 30%, rgba(120,170,255,0) 38%,
      rgba(120,190,255,.6) 44%, rgba(180,140,255,.55) 49%,
      rgba(255,140,200,.5) 54%, rgba(140,255,210,.42) 59%,
      rgba(120,170,255,0) 66%, transparent 74%);
  background-size:300% 300%;
  mix-blend-mode:screen;
  opacity:var(--prism-op);
  filter:saturate(1.25);
  animation:prism 9.4s cubic-bezier(.45,.05,.25,1) infinite;
}
/* 보조 글린트 */
.shine-glint{
  z-index:5;
  background:linear-gradient(112deg,
      transparent 47%, rgba(255,255,255,.36) 50%, transparent 53%);
  background-size:320% 320%;
  mix-blend-mode:screen;
  opacity:.5;
  animation:glint 8.6s ease-in-out infinite;
}

/* ── keyframes ── */
@keyframes sweep{ 0%{background-position:150% -50%;} 100%{background-position:-50% 150%;} }
@keyframes prism{ 0%{background-position:-40% 150%;} 50%{background-position:150% -40%;} 100%{background-position:-40% 150%;} }
@keyframes glint{ 0%,100%{background-position:-30% 140%;} 50%{background-position:140% -30%;} }
@keyframes breathe{
  0%,100%{filter:drop-shadow(var(--glow)) brightness(1)    saturate(1);}
  50%    {filter:drop-shadow(var(--glow)) brightness(1.06) saturate(1.05);}
}
@keyframes bloom{
  0%,100%{opacity:calc(var(--bloom-op) * .8); transform:scale(.98);}
  50%    {opacity:var(--bloom-op);            transform:scale(1.03);}
}

/* ── 접근성: 동작 줄이기 → 정지 ──
   WebGL은 JS가 rAF 중단 + 정적 프레임. CSS 폴백도 정지. */
@media (prefers-reduced-motion:reduce){
  .logo,.stage::before{animation:none;}
  .shine-gold{animation:none; background-position:50% 50%; opacity:.45;}
  .shine-prism{animation:none; background-position:50% 50%; opacity:calc(var(--prism-op)*.6);}
  .shine-glint{display:none;}
}
/* 수동 정지 토글: CSS 폴백 처리 (WebGL은 JS에서 처리) */
body.motion-off .logo,
body.motion-off .stage::before{animation:none;}
body.motion-off .shine-gold{animation:none; background-position:50% 50%; opacity:.45;}
body.motion-off .shine-prism{animation:none; background-position:50% 50%; opacity:calc(var(--prism-op)*.6);}
body.motion-off .shine-glint{display:none;}

/* ── 캡션 / 컨트롤 ─────────────────────────────────────────────── */
.caption{text-align:center; max-width:min(92vw,440px);}
.caption .eyebrow{
  font-size:11px; letter-spacing:2.5px; text-transform:uppercase;
  color:var(--ink-faint); margin:0 0 10px;
}
.caption h1{
  margin:0 0 8px; font-weight:650;
  font-size:clamp(19px,5.4vw,23px); letter-spacing:.3px;
}
.caption h1 .han{color:var(--accent); font-weight:750;}
.caption p{margin:0; font-size:13.5px; line-height:1.6; color:var(--ink-dim);}

.controls{display:flex; gap:10px; flex-wrap:wrap; justify-content:center;}
button{
  font:inherit; font-size:13px; font-weight:500;
  color:var(--ink);
  background:var(--panel);
  border:1px solid var(--panel-bd);
  border-radius:999px;
  padding:11px 20px;            /* 모바일 터치 타깃 ≥44px 높이 확보 */
  min-height:44px;
  cursor:pointer;
  -webkit-tap-highlight-color:transparent;
  transition:background .2s ease, border-color .2s ease, transform .08s ease;
}
button:hover{border-color:var(--accent);}
button:active{transform:scale(.97);}
button:focus-visible{outline:2px solid var(--accent); outline-offset:3px;}

.note{
  font-size:11px; line-height:1.55; color:var(--ink-faint);
  text-align:center; max-width:min(92vw,460px); opacity:.85;
}
</style>
</head>
<body>

  <div class="stage" id="stage" role="img"
       aria-label="100M1S 골드 크롬 S 로고. 금속 표면 위로 흐르는 리퀴드 메탈 광채와 무지개빛 크롬 반사가 살아 움직입니다.">
    <div class="logo"></div>
    <canvas class="metal-canvas" id="metal" aria-hidden="true"></canvas>
    <!-- CSS 폴백 레이어 (WebGL 실패 시에만 표시) -->
    <div class="layer shine shine-gold"></div>
    <div class="layer shine shine-prism"></div>
    <div class="layer shine shine-glint"></div>
  </div>

  <div class="caption">
    <p class="eyebrow">100M1S · Brand Mark</p>
    <h1>리퀴드 메탈 <span class="han">光彩</span> — v6</h1>
    <p>금속 표면 위로 리퀴드 크롬과 무지개빛 반사가 끊김 없이 흐릅니다.
       광채는 배경이 아닌 <strong>골드 표면 위에서만</strong> 살아 움직입니다.</p>
  </div>

  <div class="controls">
    <button id="theme" type="button">라이트 / 다크</button>
    <button id="motion" type="button">광채 정지 / 재생</button>
  </div>

  <p class="note" id="renderNote">내부 프리뷰 · 시스템 “동작 줄이기” 설정 시 광채가 자동으로 멈춥니다.</p>

<script>
/* ====================================================================
   리퀴드 메탈 光彩 엔진 — WebGL fragment shader (주) + CSS 폴백 (보조).
   설계 가드:
   - WebGL 컨텍스트/셰이더/텍스처 단계마다 실패 시 즉시 폴백(백지 로고 0).
   - DPR ≤ 2 캡 + 캔버스는 stage 영역만 → 모바일 발열/프레임 가드.
   - prefers-reduced-motion / 수동 토글 → rAF 중단 + 정적 프레임 1장.
   - 텍스처는 동일 출처(GitHub Pages, ACAO:*) → canvas taint 없음.
   ==================================================================== */
(function () {
  "use strict";

  var root   = document.documentElement;
  var bodyEl = document.body;

  /* ── 테마/모션 컨트롤 (CSS 효과와 공통) ── */
  if (window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches) {
    root.setAttribute('data-theme', 'light');
  }
  document.getElementById('theme').addEventListener('click', function () {
    root.setAttribute('data-theme',
      root.getAttribute('data-theme') === 'light' ? 'dark' : 'light');
    syncIntensity();
  });

  var reduceMQ = window.matchMedia ? window.matchMedia('(prefers-reduced-motion: reduce)') : null;
  function prefersReduce() { return !!(reduceMQ && reduceMQ.matches); }

  /* ── WebGL 셰이더 소스 ──────────────────────────────────────────
     vertex: 풀스크린 삼각형. fragment: FBM 노이즈 → 절차적 노멀 →
     specular flow + thin-film 이리데센스 + bloom, 로고 알파로 마스크. */
  var VERT = [
    'attribute vec2 a_pos;',
    'varying vec2 v_uv;',
    'void main(){',
    '  v_uv = a_pos * 0.5 + 0.5;',
    '  gl_Position = vec4(a_pos, 0.0, 1.0);',
    '}'
  ].join('\n');

  var FRAG = [
    'precision highp float;',
    'varying vec2 v_uv;',
    'uniform sampler2D u_logo;',   // 로고 (알파 = 실루엣 마스크)
    'uniform float u_time;',
    'uniform vec2  u_res;',
    'uniform float u_intensity;',  // 다크 1.0 / 라이트 0.68
    '',
    // --- 해시/노이즈 ---
    'float hash(vec2 p){ p = fract(p*vec2(123.34, 345.45)); p += dot(p, p+34.345); return fract(p.x*p.y); }',
    'float noise(vec2 p){',
    '  vec2 i = floor(p); vec2 f = fract(p);',
    '  float a = hash(i);',
    '  float b = hash(i+vec2(1.0,0.0));',
    '  float c = hash(i+vec2(0.0,1.0));',
    '  float d = hash(i+vec2(1.0,1.0));',
    '  vec2 u = f*f*(3.0-2.0*f);',
    '  return mix(a,b,u.x)+(c-a)*u.y*(1.0-u.x)+(d-b)*u.x*u.y;',
    '}',
    'float fbm(vec2 p){',
    '  float v = 0.0; float amp = 0.5; mat2 m = mat2(1.6,1.2,-1.2,1.6);',
    '  for(int i=0;i<5;i++){ v += amp*noise(p); p = m*p; amp *= 0.5; }',
    '  return v;',
    '}',
    '',
    // thin-film 이리데센스: 위상에 따른 무지개 (cos 팔레트)
    'vec3 iri(float t){',
    '  return 0.5 + 0.5*cos(6.28318*(vec3(0.0,0.33,0.67)+t));',
    '}',
    '',
    'void main(){',
    '  vec2 uv = v_uv;',
    '  vec4 logo = texture2D(u_logo, vec2(uv.x, 1.0 - uv.y));',  // Y 뒤집기 (GL ↕)
    '  float mask = logo.a;',
    '  if(mask < 0.01){ gl_FragColor = vec4(0.0); return; }',     // 실루엣 밖 = 0
    '',
    '  float t = u_time;',
    '  // 흐르는 금속 표면 — 두 방향 FBM 이류(advection)로 리퀴드 느낌',
    '  vec2 flow = vec2(t*0.06, -t*0.045);',
    '  float h1 = fbm(uv*3.4 + flow + fbm(uv*2.0 - flow)*0.6);',
    '  float h2 = fbm(uv*6.2 - flow*1.3 + 7.3);',
    '  float height = h1*0.7 + h2*0.3;',
    '',
    '  // 절차적 노멀 (height의 화면공간 기울기)',
    '  float e = 1.6/u_res.y;',
    '  float hx = fbm((uv+vec2(e,0.0))*3.4 + flow) - fbm((uv-vec2(e,0.0))*3.4 + flow);',
    '  float hy = fbm((uv+vec2(0.0,e))*3.4 + flow) - fbm((uv-vec2(0.0,e))*3.4 + flow);',
    '  vec3 N = normalize(vec3(-hx*2.4, -hy*2.4, 1.0));',
    '',
    '  // 움직이는 광원 + 시선',
    '  vec3 L = normalize(vec3(0.55*sin(t*0.4), 0.5+0.3*cos(t*0.33), 0.9));',
    '  vec3 V = vec3(0.0, 0.0, 1.0);',
    '  vec3 H = normalize(L+V);',
    '',
    '  // 좁고 강한 specular (크롬) — 코어는 거의 흰빛',
    '  float spec = pow(max(dot(N,H),0.0), 48.0);',
    '  float spec2= pow(max(dot(N,H),0.0), 12.0);',  // 넓은 글로우
    '  float fres = pow(1.0 - max(dot(N,V),0.0), 2.5);',  // 가장자리 림
    '',
    '  // thin-film: 높이/프레넬로 위상 이동 → 오일슬릭 무지개',
    '  vec3 rainbow = iri(height*1.4 + fres*0.7 + t*0.02);',
    '',
    '  // 골드 베이스 틴트 (금속색) + 크롬 specular + 이리데센스',
    '  vec3 gold = vec3(1.0, 0.80, 0.42);',
    '  vec3 col  = gold * (0.18 + 0.5*height);',          // 금속 음영
    '  col += rainbow * (0.55*fres + 0.30*spec2);',        // 무지개 반사 (림·글로우)
    '  col += vec3(1.0,0.98,0.92) * spec * 1.7;',          // 흰 크롬 하이라이트
    '  col += gold * spec2 * 0.5;',                        // 골드 글로우
    '',
    '  // bloom 부스트 (가장 밝은 부분 추가 발광)',
    '  float lum = max(max(col.r,col.g),col.b);',
    '  col += col * smoothstep(0.7, 1.3, lum) * 0.6;',
    '',
    '  col *= u_intensity;',
    '  // 마스크 가장자리 부드럽게 (안티에일리어싱)',
    '  float edge = smoothstep(0.0, 0.12, mask);',
    '  gl_FragColor = vec4(col * edge, 1.0);',
    '}'
  ].join('\n');

  /* ── WebGL 부트스트랩 (단계별 실패 → 폴백) ── */
  var canvas = document.getElementById('metal');
  var gl = null, prog = null, uni = {}, tex = null, rafId = 0;
  var startT = 0, lastDrawT = 0, glReady = false;

  function fallbackToCSS(reason) {
    glReady = false;
    if (rafId) { cancelAnimationFrame(rafId); rafId = 0; }
    canvas.style.opacity = '0';
    bodyEl.classList.add('gl-failed');   // CSS 광채 레이어 활성 (백지 로고 0)
    if (window.console && reason) console.info('[logo-v6] WebGL 폴백 → CSS 光彩:', reason);
  }

  function compile(type, src) {
    var s = gl.createShader(type);
    gl.shaderSource(s, src); gl.compileShader(s);
    if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) {
      console.warn('[logo-v6] shader compile fail:', gl.getShaderInfoLog(s));
      return null;
    }
    return s;
  }

  function initGL() {
    try {
      var opts = { alpha: true, premultipliedAlpha: false, antialias: true,
                   powerPreference: 'low-power', preserveDrawingBuffer: false };
      gl = canvas.getContext('webgl', opts) || canvas.getContext('experimental-webgl', opts);
    } catch (e) { gl = null; }
    if (!gl) { fallbackToCSS('컨텍스트 생성 실패'); return false; }

    var vs = compile(gl.VERTEX_SHADER, VERT);
    var fs = compile(gl.FRAGMENT_SHADER, FRAG);
    if (!vs || !fs) { fallbackToCSS('셰이더 컴파일 실패'); return false; }

    prog = gl.createProgram();
    gl.attachShader(prog, vs); gl.attachShader(prog, fs); gl.linkProgram(prog);
    if (!gl.getProgramParameter(prog, gl.LINK_STATUS)) {
      fallbackToCSS('프로그램 링크 실패'); return false;
    }
    gl.useProgram(prog);

    // 풀스크린 삼각형
    var buf = gl.createBuffer();
    gl.bindBuffer(gl.ARRAY_BUFFER, buf);
    gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, 3,-1, -1,3]), gl.STATIC_DRAW);
    var loc = gl.getAttribLocation(prog, 'a_pos');
    gl.enableVertexAttribArray(loc);
    gl.vertexAttribPointer(loc, 2, gl.FLOAT, false, 0, 0);

    uni.time = gl.getUniformLocation(prog, 'u_time');
    uni.res  = gl.getUniformLocation(prog, 'u_res');
    uni.logo = gl.getUniformLocation(prog, 'u_logo');
    uni.intensity = gl.getUniformLocation(prog, 'u_intensity');

    // 컨텍스트 손실 → 폴백
    canvas.addEventListener('webglcontextlost', function (ev) {
      ev.preventDefault(); fallbackToCSS('컨텍스트 손실');
    }, false);

    return true;
  }

  function loadTexture(img) {
    tex = gl.createTexture();
    gl.bindTexture(gl.TEXTURE_2D, tex);
    gl.pixelStorei(gl.UNPACK_PREMULTIPLY_ALPHA_WEBGL, false);
    try {
      gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, img);
    } catch (e) { fallbackToCSS('텍스처 업로드 실패(' + e.message + ')'); return false; }
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
    return true;
  }

  /* DPR ≤ 2 캡 + stage 영역만 → 모바일 발열/프레임 가드.
     레이아웃 미완료(rect 0) 시 drawingbuffer를 1×1로 굳히지 않고 false 반환 →
     호출부가 다음 프레임 재시도 (1×1 frozen 버그 방지). */
  function resize() {
    if (!glReady) return false;
    var dpr = Math.min(window.devicePixelRatio || 1, 2);
    var r = canvas.getBoundingClientRect();
    if (r.width < 2 || r.height < 2) return false;   // 레이아웃 미완료 → 재시도 신호
    var w = Math.round(r.width  * dpr);
    var h = Math.round(r.height * dpr);
    if (canvas.width !== w || canvas.height !== h) {
      canvas.width = w; canvas.height = h;
    }
    gl.viewport(0, 0, canvas.width, canvas.height);
    gl.uniform2f(uni.res, canvas.width, canvas.height);
    return true;
  }

  function syncIntensity() {
    if (!glReady) return;
    var v = parseFloat(getComputedStyle(root).getPropertyValue('--shine-intensity')) || 1;
    gl.useProgram(prog);
    gl.uniform1f(uni.intensity, v);
    drawStatic();   // 정지 상태에서도 강도 변경 즉시 반영
  }

  function drawFrame(now) {
    if (!glReady) return;
    var t = (now - startT) / 1000;
    gl.uniform1f(uni.time, t);
    gl.activeTexture(gl.TEXTURE0);
    gl.bindTexture(gl.TEXTURE_2D, tex);
    gl.uniform1i(uni.logo, 0);
    gl.drawArrays(gl.TRIANGLES, 0, 3);
  }

  function drawStatic() {
    // 정적 프레임 1장 (reduced-motion / 정지 토글): 고정 시각의 한 프레임.
    // 레이아웃 미완료 시 다음 프레임 재시도 (사이즈 0 → 빈 프레임 방지).
    if (!glReady) return;
    if (!resize()) { requestAnimationFrame(drawStatic); return; }
    drawFrame(startT + 2400);   // 보기 좋은 고정 위상
  }

  function loop(now) {
    if (!glReady) return;
    if (prefersReduce() || bodyEl.classList.contains('motion-off')) {
      rafId = 0; drawStatic(); return;   // 루프 중단, 정적 프레임
    }
    resize();                            // false(미완료)여도 다음 프레임 재시도되므로 OK
    drawFrame(now);
    rafId = requestAnimationFrame(loop);
  }

  function startLoop() {
    if (!glReady || rafId) return;
    if (prefersReduce() || bodyEl.classList.contains('motion-off')) { drawStatic(); return; }
    rafId = requestAnimationFrame(loop);
  }

  /* ── 모션 토글 버튼 (WebGL + CSS 공통) ── */
  document.getElementById('motion').addEventListener('click', function () {
    bodyEl.classList.toggle('motion-off');
    if (glReady) {
      if (bodyEl.classList.contains('motion-off')) {
        if (rafId) { cancelAnimationFrame(rafId); rafId = 0; }
        drawStatic();
      } else {
        startLoop();
      }
    }
  });

  // reduced-motion 시스템 설정 변경 실시간 반응
  if (reduceMQ) {
    var onRM = function () {
      if (!glReady) return;
      if (prefersReduce()) { if (rafId){cancelAnimationFrame(rafId);rafId=0;} drawStatic(); }
      else startLoop();
    };
    if (reduceMQ.addEventListener) reduceMQ.addEventListener('change', onRM);
    else if (reduceMQ.addListener) reduceMQ.addListener(onRM);
  }

  // 탭 비가시 시 rAF 중단 (배터리 가드), 복귀 시 재개
  document.addEventListener('visibilitychange', function () {
    if (document.hidden) { if (rafId){cancelAnimationFrame(rafId);rafId=0;} }
    else startLoop();
  });

  window.addEventListener('resize', function () { if (glReady) { resize(); if (!rafId) drawStatic(); } });

  /* ── 부트스트랩: 이미지 로드 → GL init → 텍스처 → 첫 프레임 ── */
  function boot() {
    if (!initGL()) return;   // 폴백 처리됨
    var img = new Image();
    img.decoding = 'async';
    // 동일 출처(GitHub Pages)지만 안전하게 crossOrigin 명시 (taint 방지)
    img.crossOrigin = 'anonymous';
    img.onload = function () {
      if (!gl) { fallbackToCSS('gl 소실'); return; }
      glReady = true;
      if (!loadTexture(img)) return;   // 실패 시 폴백
      startT = performance.now();

      // 첫 노출: 레이아웃 완료 후 사이즈+첫 프레임+노출 → 1×1 frozen / opacity 레이스 제거.
      // rAF(가시 탭) 와 setTimeout(백그라운드 탭에서 로드 시 rAF 미발화 대비) 중
      // 먼저 오는 쪽이 1회만 실행 → 백그라운드 로드여도 정적 1프레임은 보장.
      var revealed = false;
      function firstPaint() {
        if (revealed || !glReady) return;
        if (!resize()) {                // stage 레이아웃 미완료 → 짧게 재시도
          setTimeout(firstPaint, 50); return;
        }
        revealed = true;
        drawFrame(startT + 2400);       // 보일 첫 프레임을 먼저 그림
        canvas.style.opacity = '1';     // 그린 뒤 노출 (검은 1프레임 깜빡임 0)
        startLoop();                    // 모션 on이면 연속, reduced/백그라운드면 정적 유지
      }
      requestAnimationFrame(firstPaint);
      setTimeout(firstPaint, 120);      // rAF 미발화(백그라운드) 폴백

      document.getElementById('renderNote').textContent =
        '내부 프리뷰 · 리퀴드 메탈 실시간 렌더(WebGL) · “동작 줄이기” 시 정지.';
    };
    img.onerror = function () { fallbackToCSS('로고 텍스처 로드 실패'); };
    img.src = 'assets/logo-v5b.webp';
  }

  // 메인스레드 첫 페인트 방해 최소화
  if (document.readyState === 'complete') boot();
  else window.addEventListener('load', boot);
})();
</script>
</body>
</html>
